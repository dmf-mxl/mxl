name: Build and Test the MXL Project

on:
  push:
    branches:
      - main
      - release/**
  pull_request:
  workflow_dispatch:  # manual trigger support

permissions:
  contents: read
  issues: read
  checks: write
  pull-requests: write
  packages: write

jobs:
  compute_build_image_cache_key:
    name: Compute build image cache key prefix
    runs-on: ubuntu-latest
    outputs:
      prefix: ${{ steps.build-key.outputs.prefix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute key prefix
        id: build-key
        run: |
          printf 'prefix=build-images-${{ hashFiles('.devcontainer/Dockerfile', '.devcontainer/scripts/**/*') }}\n' >> "${GITHUB_OUTPUT}"

  create_build_images:
    name: Create build image
    runs-on: ubuntu-latest
    needs: [ compute_build_image_cache_key ]
    strategy:
      matrix:
        base-image-version: [24.04]
        architecture: [amd64, arm64]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lookup cached build image
        id: lookup-build-image
        uses: actions/cache/restore@v6
        with:
          lookup-only: true
          path: mxl-build-image-${{ matrix.architecture }}.tar.gz
          key: ${{ needs.compute_build_image_cache_key.outputs.prefix }}-${{ matrix.base-image-version }}-${{ matrix.architecture }}

      - name: Get runner UID and GID
        if: steps.lookup-build-image.outputs.cache-hit != 'true'
        id: check-user-ids
        run: |
          printf 'uid=%s\n' "$(id -u)" >> "${GITHUB_OUTPUT}"
          printf 'gid=%s\n' "$(id -g)" >> "${GITHUB_OUTPUT}"

      - name: Set up QEMU
        if: steps.lookup-build-image.outputs.cache-hit != 'true'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        if: steps.lookup-build-image.outputs.cache-hit != 'true'
        uses: docker/setup-buildx-action@v4

      - name: Build build image
        if: steps.lookup-build-image.outputs.cache-hit != 'true'
        uses: docker/build-push-action@v7
        with:
          build-args: |
            BASE_IMAGE_VERSION=${{ matrix.base-image-version }}
            USER_UID=${{ steps.check-user-ids.outputs.uid }}
            USER_GID=${{ steps.check-user-ids.outputs.gid }}
          platforms: linux/${{ matrix.architecture }}
          tags:
            mxl-build-image-${{ matrix.architecture }}:latest
          load: true
          pull: true
          context: .devcontainer

      - name: Export build image
        if: steps.lookup-build-image.outputs.cache-hit != 'true'
        run: |
          docker save 'mxl-build-image-${{ matrix.architecture }}:latest' | gzip > 'mxl-build-image-${{ matrix.architecture }}.tar.gz'

      - name: Save build image to cache
        if: steps.lookup-build-image.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: mxl-build-image-${{ matrix.architecture }}.tar.gz
          key: ${{ steps.lookup-build-image.outputs.cache-primary-key }}

  check_format_compliance:
    name: Check clang-format compliance
    runs-on: ubuntu-latest
    needs: [ compute_build_image_cache_key, create_build_images ]
    strategy:
      matrix:
        base-image-version: [24.04]
        architecture: [amd64]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore cached build image
        uses: actions/cache/restore@v6
        with:
          path: mxl-build-image-${{ matrix.architecture }}.tar.gz
          key: ${{ needs.compute_build_image_cache_key.outputs.prefix }}-${{ matrix.base-image-version }}-${{ matrix.architecture }}

      - name: Load build image
        run: |
          docker image load -i 'mxl-build-image-${{ matrix.architecture }}.tar.gz'

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Run clang-format
        run: |
          docker run \
            --rm --interactive \
            --mount src='${{ github.workspace }},target=/workspace/mxl,type=bind' \
            --platform='linux/${{ matrix.architecture }}' \
            mxl-build-image-${{ matrix.architecture }}:latest \
            bash -c " \
              cd /workspace/mxl && \
              find lib tools -iregex '.*\.\(h\|c\|hpp\|cpp\)' | xargs clang-format --dry-run --Werror
            "

  build_c_cxx:
    name: Build C library on Ubuntu - ${{ matrix.architecture }} - ${{ matrix.compiler }}
    runs-on: ubuntu-latest
    needs: [ compute_build_image_cache_key, create_build_images ]
    strategy:
      matrix:
        base-image-version: [24.04]
        architecture: [amd64, arm64]
        compiler: [Linux-GCC-Release, Linux-Clang-Release]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize Git Submodules (if needed)
        run: git submodule update --init --recursive

      - name: Restore cached build image
        uses: actions/cache/restore@v6
        with:
          path: mxl-build-image-${{ matrix.architecture }}.tar.gz
          key: ${{ needs.compute_build_image_cache_key.outputs.prefix }}-${{ matrix.base-image-version }}-${{ matrix.architecture }}

      - name: Load build image
        run: |
          docker image load -i 'mxl-build-image-${{ matrix.architecture }}.tar.gz'

      - name: Set workspace permissions for access in the devcontainer
        run: |
          mkdir -p '${{ github.workspace }}'/{build,install}
          chmod a+x,g+s '${{ github.workspace }}'/{build,install}

      - name: Restore vcpkg cache
        id: vcpkg-cache-restore
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}/vcpkg_cache
          key: vcpkg-ubuntu-${{ matrix.base-image-version }}-${{ matrix.architecture }}-${{ matrix.compiler }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-ubuntu-${{ matrix.base-image-version }}-${{ matrix.architecture }}-${{ matrix.compiler }}-

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Configure CMake
        run: |
          docker run \
            --rm --interactive \
            --mount src='${{ github.workspace }},target=/workspace/mxl,type=bind' \
            --env VCPKG_BINARY_SOURCES='clear;files,/workspace/mxl/vcpkg_cache,readwrite' \
            --platform='linux/${{ matrix.architecture }}' \
            'mxl-build-image-${{ matrix.architecture }}:latest' \
            cmake -S /workspace/mxl -B '/workspace/mxl/build/${{ matrix.compiler }}' \
              --preset '${{ matrix.compiler }}' \
              -DMXL_BUILD_NUMBER='${{ github.run_number }}' \
              -DCMAKE_INSTALL_PREFIX=/workspace/mxl/install \
              -DMXL_ENABLE_FABRICS_OFI=ON

      - name: Save vcpkg cache
        uses: actions/cache/save@v6
        with:
          path: ${{ github.workspace }}/vcpkg_cache
          key: ${{ steps.vcpkg-cache-restore.outputs.cache-primary-key }}

      - name: Build Project
        run: |
          docker run \
            --rm --interactive \
            --mount src='${{ github.workspace }},target=/workspace/mxl,type=bind' \
            --env VCPKG_BINARY_SOURCES='clear;files,/workspace/mxl/vcpkg_cache,readwrite' \
            --platform='linux/${{ matrix.architecture }}' \
            'mxl-build-image-${{ matrix.architecture }}:latest' \
            cmake --build '/workspace/mxl/build/${{ matrix.compiler }}' -t all doc install package

      - name: Run Tests
        run: |
          docker run \
            --rm --interactive \
            --mount src='${{ github.workspace }},target=/workspace/mxl,type=bind' \
            --platform='linux/${{ matrix.architecture }}' \
            --shm-size=1g \
            'mxl-build-image-${{ matrix.architecture }}:latest' \
            bash -c "
              cd '/workspace/mxl/build/${{ matrix.compiler }}' && \
              ctest --output-junit test-results.xml
            "

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: |
            **/test-results.xml

  build_rust:
    name: Build Rust bindings on Ubuntu - ${{ matrix.architecture }}
    runs-on: ubuntu-latest
    needs: [ compute_build_image_cache_key, create_build_images ]
    strategy:
      matrix:
        base-image-version: [24.04]
        architecture: [amd64, arm64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize Git Submodules (if needed)
        run: git submodule update --init --recursive

      - name: Restore cached build image
        uses: actions/cache/restore@v6
        with:
          path: mxl-build-image-${{ matrix.architecture }}.tar.gz
          key: ${{ needs.compute_build_image_cache_key.outputs.prefix }}-${{ matrix.base-image-version }}-${{ matrix.architecture }}

      - name: Load build image
        run: |
          docker image load -i 'mxl-build-image-${{ matrix.architecture }}.tar.gz'

      - name: Cache Cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-lint-ubuntu-${{ matrix.base-image-version }}-${{ matrix.architecture }}-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: cargo-lint-ubuntu-${{ matrix.base-image-version }}-${{ matrix.architecture }}-

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Check the Rust bindings
        env:
          RUSTFLAGS: "-Dwarnings"
        run: |
          docker run \
            --rm --interactive \
            --mount src='${{ github.workspace }}',target=/workspace/mxl,type=bind \
            --platform='linux/${{ matrix.architecture }}' \
            'mxl-build-image-${{ matrix.architecture }}:latest' \
            bash -c "
              cd /workspace/mxl/rust && \
              cargo fmt -- --check && \
              cargo clippy --all-targets --all-features --locked -- -D warnings && \
              cargo audit && \
              cargo outdated && \
              cargo machete && \
              cargo deny check all
            "

      - name: Build Rust bindings
        run: |
          docker run \
            --rm --interactive \
            --mount src='${{ github.workspace }}',target=/workspace/mxl,type=bind \
            --platform='linux/${{ matrix.architecture }}' \
            'mxl-build-image-${{ matrix.architecture }}:latest' \
            bash -c "
              cd /workspace/mxl/rust && \
              cargo build --release --all-targets --locked
            "

      - name: Test the Rust bindings
        shell: bash
        # The integration tests self-gate at runtime instead of #[ignore]:
        # skip! (see rust/gst-mxl-rs/tests/common) prints a libtest-style
        # "test <name> ... skipped, <reason>" line when /dev/shm or the
        # gst-plugins-rs closed-caption elements are missing. Run with
        # --show-output so those lines reach the log, then aggregate them into
        # a GitHub notice and job summary so self-skips are visible instead of
        # passing silently.
        run: |
          set +e
          docker run \
            --rm --interactive \
            --mount src='${{ github.workspace }}',target=/workspace/mxl,type=bind \
            --platform='linux/${{ matrix.architecture }}' \
            'mxl-build-image-${{ matrix.architecture }}:latest' \
            bash -c "
              cd /workspace/mxl/rust && \
              cargo test --release --all-targets --locked -- --test-threads=1 --show-output
            " 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          set -e
          skipped=$(grep -E '^test .* \.\.\. skipped,' test.log || true)
          count=$(grep -cE '^test .* \.\.\. skipped,' test.log || true)
          printf 'test result: %s skipped\n' "${count}"
          if [[ "${count}" -gt 0 ]]
          then
            printf '::notice title=Runtime tests skipped::%s test(s) self-skipped; see job summary\n' "${count}"
            printf '### Runtime tests skipped (%s)\n\n```text\n%s\n```\n' "${count}" "${skipped}" >> "${GITHUB_STEP_SUMMARY}"
          fi
          exit "${status}"
