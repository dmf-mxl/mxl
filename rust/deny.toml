# This section is considered when running `cargo deny check licenses`
# More documentation for the licenses section can be found here:
# https://embarkstudios.github.io/cargo-deny/checks/licenses/cfg.html
[licenses]
# List of explicitly allowed licenses
# See https://spdx.org/licenses/ for list of possible licenses
# [possible values: any SPDX 3.11 short identifier (+ optional exception)].
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "BSD-3-Clause",
    "ISC",
]

[advisories]
ignore = [
    # pin-utils is unmaintained and has no safe upgrade. It is a dependency of
    # futures-util, which glib and gstreamer require. Remove this entry once
    # futures-util stops depending on pin-utils.
    { id = "RUSTSEC-2026-0441", reason = "unmaintained transitive dependency of futures-util, no replacement available" },
]
